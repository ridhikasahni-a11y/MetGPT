<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — MetGPT</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--gray-50);
    padding: 1rem;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--bg);
    border: 0.5px solid var(--gray-200);
    border-radius: var(--radius-lg);
    padding: 2rem 1.75rem;
  }
  .login-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    margin-bottom: 4px;
  }
  .login-logo .logo-text {
    font-size: 22px;
    font-weight: 600;
    color: var(--teal);
    letter-spacing: -0.3px;
  }
  .login-sub {
    text-align: center;
    font-size: 13px;
    color: var(--gray-400);
    margin-bottom: 1.5rem;
  }
  .login-field { margin-bottom: 1rem; }
  .login-field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--gray-400);
    margin-bottom: 6px;
  }
  .login-field input {
    width: 100%;
    border: 0.5px solid var(--gray-200);
    border-radius: var(--radius);
    background: var(--gray-50);
    color: var(--gray-900);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .login-field input:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 2px rgba(29,158,117,0.15);
  }
  .login-btn {
    width: 100%;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 11px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.15s;
  }
  .login-btn:hover { opacity: 0.88; }
  .login-error {
    background: var(--red-bg);
    color: var(--red);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 1rem;
    text-align: center;
  }
  .login-foot {
    text-align: center;
    font-size: 11px;
    color: var(--gray-400);
    margin-top: 1.5rem;
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="13" stroke="#1D9E75" stroke-width="1.5"/>
        <path d="M7 17c1-3 3-5 7-5s6 2 7 5" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="10" cy="11" r="1.5" fill="#1D9E75"/>
        <circle cx="14" cy="9" r="1.5" fill="#1D9E75"/>
        <circle cx="18" cy="11" r="1.5" fill="#1D9E75"/>
      </svg>
      <span class="logo-text">MetGPT</span>
    </div>
    <p class="login-sub">Sign in to continue</p>

    {% if error %}
      <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="login-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn">Sign in</button>
    </form>

    <p class="login-foot">Irish weather assistant · Met Éireann data</p>
  </div>
</div>
</body>
</html>
