<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
  .sky {
    position: fixed;
    inset: 0;
    background: #12395D;
  }

  .login-wrap {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 20px;
    padding: 2.25rem 2rem;
    box-shadow: 0 20px 50px rgba(10,37,64,0.35);
  }
  .login-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    margin-bottom: 6px;
  }
  .login-logo .logo-text {
    font-size: 24px;
    font-weight: 700;
    color: #12395D;
    letter-spacing: -0.4px;
  }
  .login-sub {
    text-align: center;
    font-size: 13px;
    color: #4E5A66;
    margin-bottom: 1.75rem;
  }
  .login-field { margin-bottom: 1rem; }
  .login-field label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: #7C8894;
    margin-bottom: 6px;
  }
  .login-field input {
    width: 100%;
    border: 1px solid #D2DBE4;
    border-radius: 10px;
    background: #F7F9FB;
    color: #14212E;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .login-field input:focus {
    border-color: #1D5FA0;
    box-shadow: 0 0 0 3px rgba(29,95,160,0.18);
  }
  .login-btn {
    width: 100%;
    background: linear-gradient(135deg, #12395D, #1D5FA0);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 6px 16px rgba(18,57,93,0.28);
  }
  .login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(18,57,93,0.36); }
  .login-btn:active { transform: translateY(0); }
  .login-error {
    background: #FCEBEB;
    color: #A32D2D;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
    margin-bottom: 1rem;
    text-align: center;
  }
  .login-foot {
    text-align: center;
    font-size: 11px;
    color: #7C8894;
    margin-top: 1.75rem;
  }
</style>
</head>
<body>
<div class="sky"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <svg width="30" height="30" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="13" stroke="#12395D" stroke-width="1.5"/>
        <path d="M7 17c1-3 3-5 7-5s6 2 7 5" stroke="#12395D" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="10" cy="11" r="1.5" fill="#12395D"/>
        <circle cx="14" cy="9" r="1.5" fill="#12395D"/>
        <circle cx="18" cy="11" r="1.5" fill="#12395D"/>
      </svg>
      <span class="logo-text">MetGPT</span>
    </div>
    <p class="login-sub">Your Irish weather assistant</p>

    {% if error %}
      <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="login-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
